[build-system]
build-backend = "maturin"
requires      = ["maturin==1.16.0"]

[project]
authors         = [{ name = "James Parkington" }]
dependencies    = [
    "bibtexparser",
    "chess",
    "cyclopts",
    "markdown-it-py",
    "mdit-py-plugins",
    "more-itertools",
    "polars",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "requests",
    "rich",
    "urllib3"
]
description     = "Finds the grandmaster game sharing the longest run of positions with a submitted chess game and shows how that game continued."
keywords        = [
    "chess",
    "chess-analysis",
    "chess-database",
    "parquet",
    "pgn",
    "python",
    "python-chess"
]
license         = "GPL-3.0-or-later"
license-files   = ["LICENSE.md"]
name            = "scotch"
readme          = ".github/README.md"
requires-python = ">=3.15"
version         = "0.1.0"

[project.scripts]
scotch = "scotch.cli:app"

[project.urls]
Homepage   = "https://scotch.fyi"
Repository = "https://github.com/Jybbs/scotch"

[dependency-groups]
dev = [
    "hypothesis",
    "minijinja",
    "prose-formatter",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-socket",
    "pytest-subprocess",
    "responses",
    "syrupy"
]

[tool.coverage.html]
directory = ".cache/coverage/html"

[tool.coverage.report]
fail_under                 = 95
include_namespace_packages = true
precision                  = 2
show_missing               = true

[tool.coverage.run]
branch    = true
data_file = ".cache/coverage/data"
source    = ["src/scotch"]

[tool.maturin]
data          = "src/scotch.data"
features      = ["python"]
include       = [
    { format = "sdist", path = ".github/scripts/**/*" },
    { format = "sdist", path = ".mise/**/*" },
    { format = "sdist", path = "src/scotch.data/**/*" },
    { format = "sdist", path = "tests/**/*" },
    { format = "sdist", path = "uv.lock" }
]
manifest-path = "rust/Cargo.toml"
module-name   = "scotch.games.readers"
python-source = "src"

[tool.prose]
target-version = "3.15"

[tool.prose.imports]
first-party = ["scotch"]

[tool.pytest]
addopts                  = [
    "--allow-unix-socket",
    "--disable-socket",
    "--import-mode=importlib",
    "-m",
    "not network",
    "-ra",
    "--snapshot-default-extension=common.snapshots.PlainFile",
    "--snapshot-dirname=fixtures"
]
cache_dir                = ".cache/pytest"
empty_parameter_set_mark = "fail_at_collect"
filterwarnings           = [
    "error",
    "ignore:'asyncio.DefaultEventLoopPolicy' is deprecated:DeprecationWarning:chess.engine"
]
markers                  = [
    "network: reaches a service over the network, so the default run deselects it and a selected run lets it open a connection",
    "slow: runs longer than a few seconds, so a fast local run deselects it"
]
norecursedirs            = ["common", "fixtures"]
python_files             = ["*.py"]
pythonpath               = ["tests"]
strict                   = true
testpaths                = ["tests"]

[tool.uv]
build-constraint-dependencies = ["cython==3.3.0", "setuptools==84.2.1", "tomlkit==0.15.2"]
cache-keys                    = [
    { file = "pyproject.toml" },
    { file = "rust/Cargo.lock" },
    { file = "rust/Cargo.toml" },
    { file = "rust/src/**/*.rs" }
]
python-downloads              = "never"
python-preference             = "only-system"
required-version              = "==0.12.13"
