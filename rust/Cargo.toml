[package]
description  = "Reads chess games under python-chess's rules for PGN and keys their positions by their Zobrist hashes, for Scotch's command line and its site"
edition      = "2024"
license      = "GPL-3.0-or-later"
name         = "scotch"
publish      = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3", "shakmaty/magics"]
wasm   = ["dep:wasm-bindgen"]

[dependencies]
pyo3         = { optional = true, version = "0.30.1" }
shakmaty     = { default-features = false, features = ["std"], version = "0.30.2" }
wasm-bindgen = { optional = true, version = "=0.2.130" }

[profile.release]
codegen-units = 1
lto           = true

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
