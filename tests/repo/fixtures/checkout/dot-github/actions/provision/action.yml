description: Installs the tools a job runs
inputs:
  save:
    default: 'false'
    description: Whether to write the tool cache back
  tools:
    description: The tools to install
    required: true
name: Provision
runs:
  steps:
    - name: Install the tools
      uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492
      with:
        cache_save: ${{ inputs.save }}
        install_args: ${{ inputs.tools }}
  using: composite
