description: Checks out the repository and installs the tools a job runs through the mise release `.mise/config.toml` sets as its floor, restoring the tool cache and writing it back only where asked
inputs:
  save:
    default: 'false'
    description: Whether to write the tool cache back once the install finishes on a cache miss, which only ♟️ Warm does
  tools:
    description: The tools to install, a space-separated subset of the ones `.mise/config.toml` pins
    required: true
name: Provision
runs:
  steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Read the mise floor
      id: floor
      shell: bash
      run: |
        python3 -c 'import tomllib; print("version=" + tomllib.load(open(".mise/config.toml", "rb"))["min_version"])' >> "$GITHUB_OUTPUT"
    - name: Install the tools
      uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492
      with:
        cache_save: ${{ inputs.save }}
        install_args: ${{ inputs.tools }}
        version: ${{ steps.floor.outputs.version }}
  using: composite
