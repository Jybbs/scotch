concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  press:
    if: needs.order.outputs.skip != 'true'
    name: 📰 Press
    needs: order
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools
        uses: $/.github/actions/provision
        with:
          ref: ${{ inputs.ref }}
          shared-key: scotch-wasm
          tools: bun github:wasm-bindgen/wasm-bindgen lychee node rust
      - name: Build the site and check its links
        run: mise run site:links
      - name: Attach the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: site
          path: docs/.vitepress/dist
          retention-days: 1
    timeout-minutes: 15
  coverage:
    if: needs.order.outputs.skip != 'true'
    name: ☂️ Coverage
    needs: order
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Read the total the merged pull request attached
        id: reuse
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: .mise/tasks/gha/reuse.py "$RUNNER_TEMP/total"
      - name: Install the tools
        if: ${{ steps.reuse.outputs.found != 'true' }}
        uses: $/.github/actions/provision
        with:
          ref: ${{ inputs.ref }}
          shared-key: scotch-python
          tools: python rust uv
      - name: Run the suite under coverage
        if: ${{ steps.reuse.outputs.found != 'true' }}
        run: mise run py:coverage
      - name: Write the total the badge reads
        if: ${{ steps.reuse.outputs.found != 'true' }}
        run: mise run gha:total -- "$RUNNER_TEMP/total"
      - name: Attach the total
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: total
          path: ${{ runner.temp }}/total
          retention-days: 1
    timeout-minutes: 15
  deploy:
    if: github.ref == 'refs/heads/main'
    name: 🚀 Deploy
    needs:
      - coverage
      - press
    outputs:
      url: ${{ steps.publish.outputs.deployment-url }}
    permissions: {}
    runs-on: ubuntu-26.04
    steps:
      - name: Download the site and the total
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          merge-multiple: true
          path: docs/.vitepress/dist
      - name: Publish the site to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_TOKEN }}
          command: pages deploy --branch=main --project-name=scotch docs/.vitepress/dist
          wranglerVersion: 4.160.0
    timeout-minutes: 10
  order:
    name: ⏳ Order
    outputs:
      skip: ${{ steps.store.outputs.skip }}
    permissions:
      actions: read
    runs-on: ubuntu-26.04
    steps:
      - name: Leave the publish to the store's run where one follows
        env:
          EVENT: ${{ github.event_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        id: store
        run: |
          skip=false
          if [[ "$EVENT" == push ]]; then
            [[ "$(gh run list --commit "$SHA" --event push --json databaseId --jq length --workflow store.yml)" == 0 ]] || skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
    timeout-minutes: 5
  scoresheet:
    if: always()
    name: 🖋️ Scoresheet
    needs:
      - coverage
      - deploy
      - order
      - press
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools
        uses: $/.github/actions/provision
        with:
          tools: python uv
      - name: Write the summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: mise run gha:scoresheet
    timeout-minutes: 5
name: ♟️ Deploy
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
      - .mise/tasks/gha/reuse.py
      - .mise/tasks/gha/total
      - .mise/tasks/py/coverage
      - .mise/tasks/site/**
      - docs/**
      - src/**
      - '!src/scotch/cli/fetch.py'
      - '!src/scotch/cli/index.py'
      - '!src/scotch/cli/publish.py'
      - '!src/scotch/games/**'
      - '!src/scotch/index/**'
      - '!src/scotch/sources/**'
      - tests/**
  workflow_dispatch:
    inputs:
      ref:
        default: ''
        description: The commit the run builds and publishes, an empty value building the one the branch names
permissions:
  contents: read
