concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build:
    name: 🗃️ Build
    outputs:
      store: ${{ steps.named.outputs.store }}
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools
        uses: $/.github/actions/provision
        with:
          shared-key: scotch-python
          tools: python rust uv
      - name: Fetch the games
        run: mise run data:fetch
      - name: Build the index
        run: mise run data:index
      - name: Write the store
        run: mise run data:publish
      - name: Name the store's file
        id: named
        run: echo "store=$(jq --raw-output .store .cache/data/store/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Attach the store
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: store
          path: .cache/data/store
          retention-days: 1
    timeout-minutes: 60
  deploy:
    name: 🚀 Deploy
    needs: publish
    permissions:
      actions: write
    runs-on: ubuntu-26.04
    steps:
      - name: Publish the site that reads the store
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --field "ref=$GITHUB_SHA" --ref main
    timeout-minutes: 5
  publish:
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      STORE: ${{ needs.build.outputs.store }}
    if: github.ref == 'refs/heads/main'
    name: 🪣 Publish
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the store
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: store
          path: ${{ runner.temp }}/store
      - name: Publish the store to R2, then the manifest naming it
        run: |
          aws s3 cp "$RUNNER_TEMP/store/$STORE" "s3://scotch-store/$STORE" --cache-control "public, max-age=31536000, immutable" --content-type application/octet-stream --no-progress
          aws s3 cp "$RUNNER_TEMP/store/manifest.json" s3://scotch-store/manifest.json --cache-control no-cache --content-type application/json --no-progress
      - name: Delete each store file past the newest earlier ones
        continue-on-error: true
        run: .mise/tasks/gha/retire.py scotch-store "$STORE"
    timeout-minutes: 30
  scoresheet:
    if: always()
    name: 🖋️ Scoresheet
    needs:
      - build
      - deploy
      - publish
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools
        uses: $/.github/actions/provision
        with:
          tools: python uv
      - name: Write the summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: mise run gha:scoresheet
    timeout-minutes: 5
name: ♟️ Store
on:
  push:
    branches:
      - main
    paths:
      - .github/actions/provision/action.yml
      - .github/workflows/store.yml
      - .mise/bin/**
      - .mise/config.toml
      - .mise/mise.lock
      - .mise/tasks/data/**
      - pyproject.toml
      - rust/**
      - src/scotch/cli/fetch.py
      - src/scotch/cli/index.py
      - src/scotch/cli/publish.py
      - src/scotch/games/**
      - src/scotch/index/**
      - src/scotch/sources/**
      - uv.lock
  workflow_dispatch:
permissions:
  contents: read
