concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build:
    name: 🗃️ Build
    outputs:
      store: ${{ steps.named.outputs.store }}
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools
        uses: $/.github/actions/provision
        with:
          shared-key: scotch-python
          tools: python rust uv
      - name: Fetch the games
        run: mise run data:fetch
      - name: Build the index
        run: mise run data:index
      - name: Write the store
        run: mise run data:publish
      - name: Name the store's file
        id: named
        run: echo "store=$(jq --raw-output .store .cache/data/store/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Attach the store
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: store
          path: .cache/data/store
          retention-days: 1
    timeout-minutes: 60
  publish:
    if: github.ref == 'refs/heads/main'
    name: 🪣 Publish
    needs: build
    permissions: {}
    runs-on: ubuntu-26.04
    steps:
      - name: Download the store
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: store
          path: store
      - name: Publish the store to R2, then the manifest naming it
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_STORE_TOKEN }}
          wranglerVersion: 4.160.0
          command: |
            r2 object put scotch-store/${{ needs.build.outputs.store }} --file=store/${{ needs.build.outputs.store }} --cache-control="public, max-age=31536000, immutable" --content-type=application/octet-stream --remote
            r2 object put scotch-store/manifest.json --file=store/manifest.json --cache-control=no-cache --content-type=application/json --remote
    timeout-minutes: 30
  scoresheet:
    if: always()
    name: 🖋️ Scoresheet
    needs:
      - build
      - publish
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools
        uses: $/.github/actions/provision
        with:
          tools: python uv
      - name: Write the summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: mise run gha:scoresheet
    timeout-minutes: 5
name: ♟️ Store
on:
  push:
    branches:
      - main
    paths:
      - .github/actions/provision/action.yml
      - .github/workflows/store.yml
      - .mise/bin/**
      - .mise/config.toml
      - .mise/mise.lock
      - .mise/tasks/data/**
      - pyproject.toml
      - rust/**
      - src/scotch/cli/fetch.py
      - src/scotch/cli/index.py
      - src/scotch/cli/publish.py
      - src/scotch/games/**
      - src/scotch/index/**
      - src/scotch/sources/**
      - uv.lock
  workflow_dispatch:
permissions:
  contents: read
