concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  kit:
    name: 🧰 Kit (${{ matrix.tools }})
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools and save their cache
        uses: $/.github/actions/provision
        with:
          save: 'true'
          tools: ${{ matrix.tools }}
    strategy:
      fail-fast: false
      matrix:
        tools:
          - python uv
          - zizmor
    timeout-minutes: 10
  prune:
    name: 🧹 Prune
    needs: kit
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Delete each cache a newer one replaced
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: .mise/tasks/gha/prune.py
    timeout-minutes: 5
  brief:
    if: always()
    name: ⏱️ Brief
    needs:
      - kit
      - prune
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools
        uses: $/.github/actions/provision
        with:
          tools: python uv
      - name: Write the summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: mise run gha:brief
    timeout-minutes: 5
name: ♟️ Warm
on:
  push:
    branches:
      - main
    paths:
      - .github/actions/provision/action.yml
      - .github/workflows/warm.yml
      - .mise/config.toml
      - .mise/mise.lock
  workflow_dispatch:
permissions:
  contents: read
