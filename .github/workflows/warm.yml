concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  kit:
    name: 🧰 Kit (${{ matrix.tools }})
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools and save their cache
        uses: $/.github/actions/provision
        with:
          save: 'true'
          tools: ${{ matrix.tools }}
    strategy:
      fail-fast: false
      matrix:
        tools:
          - bun github:wasm-bindgen/wasm-bindgen lychee node rust
          - bun osv-scanner python rust uv
          - python rust
          - python rust uv
          - python uv
          - zizmor
    timeout-minutes: 10
  cargo:
    name: 📦 Cargo (${{ matrix.shared-key }})
    needs: kit
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools and restore the Cargo cache
        uses: $/.github/actions/provision
        with:
          save: 'true'
          shared-key: ${{ matrix.shared-key }}
          tools: ${{ matrix.tools }}
      - name: Build the crate and save the Cargo cache
        run: ${{ matrix.command }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - command: mise run rs:check
            shared-key: scotch-clippy
            tools: python rust
          - command: mise run rs:test -- --no-run
            shared-key: scotch-crate
            tools: python rust
          - command: mise x -- uv sync
            shared-key: scotch-python
            tools: python rust uv
          - command: mise run rs:wasm
            shared-key: scotch-wasm
            tools: bun github:wasm-bindgen/wasm-bindgen lychee node rust
    timeout-minutes: 20
  prune:
    name: 🧹 Prune
    needs:
      - cargo
      - kit
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Delete each cache a newer one replaced
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: .mise/tasks/gha/prune.py
    timeout-minutes: 5
  brief:
    if: always()
    name: ⏱️ Brief
    needs:
      - cargo
      - kit
      - prune
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools
        uses: $/.github/actions/provision
        with:
          tools: python uv
      - name: Write the summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: mise run gha:brief
    timeout-minutes: 5
name: ♟️ Warm
on:
  push:
    branches:
      - main
    paths:
      - .github/actions/provision/action.yml
      - .github/workflows/warm.yml
      - .mise/config.toml
      - .mise/mise.lock
      - rust/Cargo.lock
      - rust/Cargo.toml
      - rust/src/**
  workflow_dispatch:
permissions:
  contents: read
