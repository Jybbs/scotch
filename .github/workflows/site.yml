concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  press:
    name: 📰 Press
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools
        uses: $/.github/actions/provision
        with:
          shared-key: scotch-wasm
          tools: bun github:wasm-bindgen/wasm-bindgen lychee node rust
      - name: Build the site
        run: mise run site:press
      - name: Attach the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: site
          path: docs/.vitepress/dist
          retention-days: 1
    timeout-minutes: 15
  links:
    name: 🔗 Links
    needs: press
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools
        uses: $/.github/actions/provision
        with:
          tools: bun github:wasm-bindgen/wasm-bindgen lychee node rust
      - name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: site
          path: docs/.vitepress/dist
      - name: Install the site's packages
        run: mise run site:install
      - name: Check the site's links
        run: mise run --skip-deps site:links
    timeout-minutes: 15
  check:
    name: ${{ matrix.name }}
    outputs:
      coverage: ${{ steps.coverage.outputs.artifact-url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools
        uses: $/.github/actions/provision
        with:
          shared-key: ${{ matrix.shared-key }}
          tools: ${{ matrix.tools }}
      - name: Run the task
        run: mise run ${{ matrix.task }}
      - name: Read the coverage report's folder
        id: report
        if: ${{ !cancelled() && matrix.task == 'site:coverage' }}
        run: |
          node --eval "const { default: config } = await import('./docs/.vitepress/vitest.config.ts'); console.log('path=' + config.test.coverage.reportsDirectory)" --input-type=module >> "$GITHUB_OUTPUT"
      - name: Attach the coverage report
        id: coverage
        if: ${{ !cancelled() && steps.report.outputs.path }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage
          path: ${{ steps.report.outputs.path }}
          retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ☂️ Coverage
            shared-key: scotch-wasm
            task: site:coverage
            tools: bun github:wasm-bindgen/wasm-bindgen lychee node rust
          - name: 📋 Audit
            shared-key: scotch-python
            task: repo:audit
            tools: python rust uv
          - name: ✂️ Knip
            shared-key: scotch-wasm
            task: site:cruft
            tools: bun github:wasm-bindgen/wasm-bindgen lychee node rust
          - name: ⚓ Oxlint
            task: site:lint
            tools: bun github:wasm-bindgen/wasm-bindgen lychee node rust
          - name: 🧷 Types
            shared-key: scotch-wasm
            task: site:typecheck
            tools: bun github:wasm-bindgen/wasm-bindgen lychee node rust
    timeout-minutes: 15
  scoresheet:
    if: always()
    name: 🖋️ Scoresheet
    needs:
      - check
      - links
      - press
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools
        uses: $/.github/actions/provision
        with:
          tools: python uv
      - name: Write the summary
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          NEEDS: ${{ toJSON(needs) }}
        run: mise run gha:scoresheet
    timeout-minutes: 5
name: ♟️ Site
on:
  pull_request:
    paths:
      - .github/CONTRIBUTING.md
      - .github/README.md
      - .github/actions/provision/action.yml
      - .github/scripts/summaries/**
      - .github/workflows/site.yml
      - .mise/config.toml
      - .mise/mise.lock
      - .mise/tasks/gha/scoresheet.py
      - .mise/tasks/gha/scoresheet.py.lock
      - .mise/tasks/rs/wasm
      - .mise/tasks/site/**
      - docs/**
      - pyproject.toml
      - rust/**
  workflow_dispatch:
permissions:
  contents: read
