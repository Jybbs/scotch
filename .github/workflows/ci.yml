concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  check:
    name: ${{ matrix.name }}
    outputs:
      coverage: ${{ steps.coverage.outputs.artifact-url }}
      site-coverage: ${{ steps.site-coverage.outputs.artifact-url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools
        uses: $/.github/actions/provision
        with:
          shared-key: ${{ matrix.shared-key }}
          tools: ${{ matrix.tools }}
      - name: Run the task
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run ${{ matrix.task }}
      - name: Read the coverage report's folder
        id: report
        if: ${{ !cancelled() && matrix.task == 'py:coverage' }}
        run: |
          python3 -c 'import tomllib; print("path=" + tomllib.load(open("pyproject.toml", "rb"))["tool"]["coverage"]["html"]["directory"])' >> "$GITHUB_OUTPUT"
      - name: Attach the coverage report
        id: coverage
        if: ${{ !cancelled() && steps.report.outputs.path }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage
          path: ${{ steps.report.outputs.path }}
          retention-days: 14
      - name: Read the folder of the site's coverage report
        id: site-report
        if: ${{ !cancelled() && matrix.task == 'site:coverage' }}
        run: |
          node --eval "const { default: config } = await import('./docs/.vitepress/vitest.config.ts'); console.log('path=' + config.test.coverage.reportsDirectory)" --input-type=module >> "$GITHUB_OUTPUT"
      - name: Attach the site's coverage report
        id: site-coverage
        if: ${{ !cancelled() && steps.site-report.outputs.path }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: site-coverage
          path: ${{ steps.site-report.outputs.path }}
          retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🩺 Advisories
            task: lock:audit
            tools: bun osv-scanner python rust uv
          - name: 🔐 Lockfiles
            task: lock:check
            tools: bun osv-scanner python rust uv
          - name: 🪻 Prose
            shared-key: scotch-python
            task: py:check
            tools: python rust uv
          - name: 🎯 Coverage
            shared-key: scotch-python
            task: py:coverage
            tools: python rust uv
          - name: 📋 Audit
            shared-key: scotch-python
            task: repo:audit
            tools: python rust uv
          - name: 🔦 Workflows
            task: repo:lint
            tools: zizmor
          - name: 📎 Clippy
            shared-key: scotch-clippy
            task: rs:check
            tools: python rust
          - name: 🦀 Crate
            shared-key: scotch-crate
            task: rs:test
            tools: python rust
          - name: 🎯 Site Coverage
            shared-key: scotch-wasm
            task: site:coverage
            tools: bun github:wasm-bindgen/wasm-bindgen lychee node rust
          - name: ✂️ Knip
            shared-key: scotch-wasm
            task: site:cruft
            tools: bun github:wasm-bindgen/wasm-bindgen lychee node rust
          - name: 🔗 Links
            task: site:links
            tools: bun github:wasm-bindgen/wasm-bindgen lychee node rust
          - name: ⚓ Oxlint
            task: site:lint
            tools: bun github:wasm-bindgen/wasm-bindgen lychee node rust
          - name: 📰 Press
            task: site:press
            tools: bun github:wasm-bindgen/wasm-bindgen lychee node rust
          - name: 🧷 Types
            shared-key: scotch-wasm
            task: site:typecheck
            tools: bun github:wasm-bindgen/wasm-bindgen lychee node rust
    timeout-minutes: 15
  brief:
    if: always()
    name: ⏱️ Brief
    needs: check
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tools
        uses: $/.github/actions/provision
        with:
          tools: python uv
      - name: Write the summary
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          NEEDS: ${{ toJSON(needs) }}
        run: mise run gha:brief
    timeout-minutes: 5
name: ♟️ CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
