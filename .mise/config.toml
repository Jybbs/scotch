min_version = "2026.11.12"

[doctor.checks.bun-lock]
description = "`docs/bun.lock` matches `docs/package.json`"
hint        = "mise relock"
run         = "bun install --cwd docs --dry-run --frozen-lockfile --no-summary"
timeout     = "30s"

[doctor.checks.cargo-lock]
description = "`rust/Cargo.lock` matches `rust/Cargo.toml`"
hint        = "mise relock"
run         = "cargo metadata --format-version 1 --locked --manifest-path rust/Cargo.toml >/dev/null"
timeout     = "30s"

[doctor.checks.mise-lock]
description = "`.mise/mise.lock` matches `.mise/config.toml`"
hint        = "mise relock"
run         = "mise lock --check"
timeout     = "30s"

[doctor.checks.script-locks]
description = "Each task script's lockfile matches the script's inline metadata"
hint        = "mise relock"
run         = 'for script in $(grep -lrsx "# /// script" .mise/tasks); do uv lock --check --script "$script" || exit; done'
timeout     = "30s"

[doctor.checks.site-packages]
description = "`docs/node_modules` exists"
hint        = "mise run site:install"
run         = "test -d docs/node_modules"
timeout     = "5s"

[doctor.checks.tests-link]
description = "`tests/node_modules` links to `docs/node_modules`"
hint        = "mise run site:install"
run         = 'test -L tests/node_modules && test -d docs/node_modules && test "$(cd tests/node_modules && pwd -P)" = "$(cd docs/node_modules && pwd -P)"'
timeout     = "5s"

[doctor.checks.uv-lock]
description = "`uv.lock` matches `pyproject.toml`"
hint        = "mise relock"
run         = "uv lock --check"
timeout     = "30s"

[doctor.checks.venv]
description = "`.venv` exists and runs on the Python interpreter mise pins"
hint        = "mise x -- uv venv --clear .venv && mise x -- uv sync"
run         = 'test -d .venv && test "$(.venv/bin/python -c "import sys; print(sys.base_prefix)")" = "$(python -c "import sys; print(sys.prefix)")"'
timeout     = "5s"

[env]
_.path                    = ".mise/bin"
AUDIT_IGNORE              = "CVE-2026-124249 GHSA-fc5q-39xc-vjpf"
BUN_INSTALL_CACHE_DIR     = "{{config_root}}/.cache/bun"
CARGO_DENY_DB_PATH        = "{{config_root}}/.cache/cargo-deny"
CARGO_TARGET_DIR          = "{{config_root}}/.cache/cargo"
JITI_FS_CACHE             = "false"
NODE_COMPILE_CACHE        = "{{config_root}}/.cache/node"
NPM_CONFIG_IGNORE_SCRIPTS = "true"
PROSE_CACHE_DIR           = "{{config_root}}/.cache/prose"
PYTHONPYCACHEPREFIX       = "{{config_root}}/.cache/pycache"
TESTMON_DATAFILE          = "{{config_root}}/.cache/testmon/data"
UV_LOCKED                 = "1"

[settings]
auto_install = false

[settings.task]
source_freshness_hash_contents = true

[tool_config]
locked = true

[tools]
bun                                = "1.4.4"
cargo-deny                         = { os = ["linux", "macos/arm64", "windows"], version = "0.21.0" }
coreutils                          = "0.12.0"
gh                                 = "2.104.0"
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
jq                                 = "1.8.2"
lychee                             = "0.24.2"
node                               = "26.13.1"
python                             = "3.15.2"
rust                               = { components = "clippy,rustfmt", profile = "minimal", targets = "wasm32-unknown-unknown", version = "1.100.0" }
uv                                 = "0.13.9"
zizmor                             = "1.32.0"
