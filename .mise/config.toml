min_version = "2026.10.18"

[doctor.checks.venv]
description = "`.venv` exists and runs on the Python interpreter mise pins"
hint        = "mise x -- uv venv --clear .venv && mise x -- uv sync"
run         = 'test -d .venv && test "$(.venv/bin/python -c "import sys; print(sys.base_prefix)")" = "$(python -c "import sys; print(sys.prefix)")"'
timeout     = "5s"

[env]
_.path                       = ".mise/bin"
CARGO_TARGET_DIR             = "{{config_root}}/.cache/cargo"
HYPOTHESIS_STORAGE_DIRECTORY = "{{config_root}}/.cache/hypothesis"
JITI_FS_CACHE                = "false"
NODE_COMPILE_CACHE           = "{{config_root}}/.cache/node"
PROSE_CACHE_DIR              = "{{config_root}}/.cache/prose"
PYTHONPYCACHEPREFIX          = "{{config_root}}/.cache/pycache"
UV_LOCKED                    = "1"

[settings]
auto_install = false

[tool_config]
locked = true

[tools]
bun                                = "1.4.3"
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
lychee                             = "0.24.2"
node                               = "26.11.1"
osv-scanner                        = "2.7.0"
python                             = "3.15.2"
rust                               = { components = "clippy,rustfmt", profile = "minimal", targets = "wasm32-unknown-unknown", version = "1.99.1" }
uv                                 = "0.12.13"
zizmor                             = "1.30.1"
