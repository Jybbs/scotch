min_version = "2026.9.18"

[doctor.checks.libyaml]
depends     = "venv"
description = "PyYAML in `.venv` was built against LibYAML, which backs the `CSafeLoader` that `scotch.repo` reads the YAML under `.github/` through"
hint        = 'Install LibYAML through `apt install libyaml-dev` on Debian or Ubuntu, then rebuild PyYAML against it through `mise x -- uv sync --no-cache --reinstall-package pyyaml`. On macOS, install it through `brew install libyaml` and run the rebuild with `CPATH="$(brew --prefix)/include" LIBRARY_PATH="$(brew --prefix)/lib"` set, since the compiler there searches no Homebrew prefix.'
run         = ".venv/bin/python -c 'import yaml; yaml.CSafeLoader'"
timeout     = "5s"

[doctor.checks.venv]
description = "`.venv` exists and runs on the Python interpreter mise pins"
hint        = "mise x -- uv venv --clear .venv && mise x -- uv sync"
run         = 'test -d .venv && test "$(.venv/bin/python -c "import sys; print(sys.base_prefix)")" = "$(python -c "import sys; print(sys.prefix)")"'
timeout     = "5s"

[env]
_.path                       = ".mise/bin"
HYPOTHESIS_STORAGE_DIRECTORY = "{{config_root}}/.cache/hypothesis"
JITI_FS_CACHE                = "false"
NODE_COMPILE_CACHE           = "{{config_root}}/.cache/node"
PROSE_CACHE_DIR              = "{{config_root}}/.cache/prose"
PYTHONPYCACHEPREFIX          = "{{config_root}}/.cache/pycache"
UV_LOCKED                    = "1"

[settings]
auto_install = false

[tool_config]
locked = true

[tools]
bun    = "1.4.3"
lychee = "0.24.2"
node   = "26.11.1"
python = "3.15.2"
uv     = "0.12.13"
zizmor = "1.30.1"
